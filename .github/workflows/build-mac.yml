name: Build Mac plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (Audio Unit, VST3, app)
        run: cmake --build build --config Release --parallel 4

      - name: Package
        run: |
          set -e
          mkdir -p dist
          cp -R build/HumAndChordMidiFX_artefacts/Release/AU/*.component dist/
          cp -R build/HumAndChordAudioFX_artefacts/Release/AU/*.component dist/
          cp -R build/HumAndChord_artefacts/Release/VST3/*.vst3 dist/
          cp -R build/HumAndChord_artefacts/Release/Standalone/*.app dist/
          for bundle in dist/*.component dist/*.vst3 dist/*.app; do
            codesign --force --deep --sign - "$bundle"
          done
          cp packaging/Install.command dist/
          chmod +x dist/Install.command
          cp packaging/READ-ME-FIRST.txt dist/
          ditto -c -k --keepParent dist Hum-and-Chord-mac.zip

      - name: Make the installer (.pkg)
        run: bash packaging/make-installer.sh build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Hum-and-Chord-mac
          path: |
            Hum-and-Chord-mac.zip
            dist-installer/*.pkg

      - name: Publish to the Releases page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Hum-and-Chord-mac.zip dist-installer/*.pkg \
            --title "Hum and Chord for Mac (latest build)" \
            --notes "Download the .pkg installer and double-click it (see the README if macOS asks you to allow it), or use Hum-and-Chord-mac.zip and its READ-ME-FIRST.txt. Built from ${{ github.sha }}."

      - name: Install with the .pkg, then check the Audio Units with Apple's validator
        run: |
          sudo installer -pkg dist-installer/*.pkg -target /
          ls "/Library/Audio/Plug-Ins/Components/Hum and Chord.component" \
             "/Library/Audio/Plug-Ins/Components/Hum and Chord Audio.component" \
             "/Library/Audio/Plug-Ins/VST3/Hum and Chord.vst3" \
             "/Applications/Hum and Chord.app" > /dev/null
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumi Hmfx Hmch
          auval -v aufx Hmau Hmch
